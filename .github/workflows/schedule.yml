name: Twice-daily job digest

# Runs the job-finder digest (fetch -> score -> draft -> send to WhatsApp) on
# a schedule, so it works even when Fozia's laptop is off/asleep. This
# workflow only runs `run-digest` (the job digest) — it never applies to a
# job or posts anything; see src/digest.py for that guarantee in code.
#
# Pakistan (Asia/Karachi) is UTC+5 year-round — it does NOT observe daylight
# saving time, so this fixed UTC offset is correct for every day of the year
# and never needs a seasonal adjustment.
on:
  schedule:
    # 9:00 AM Asia/Karachi = 04:00 UTC
    - cron: '0 4 * * *'
    # 5:00 PM Asia/Karachi = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab, any time

permissions:
  contents: write  # needed to commit the updated dedup cache back to the repo

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          # Required — see README.md for exactly where each of these comes
          # from in your local .env. All read as plain environment variables,
          # the same way src/config.py reads a local .env via python-dotenv.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_META_TOKEN: ${{ secrets.WHATSAPP_META_TOKEN }}
          WHATSAPP_META_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_META_PHONE_NUMBER_ID }}
          WHATSAPP_META_TO_NUMBER: ${{ secrets.WHATSAPP_META_TO_NUMBER }}
          # Optional — Adzuna widens the job pool but isn't required; if you
          # don't add these secrets they simply resolve to empty strings and
          # the Adzuna source is skipped (same as leaving them blank locally).
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m src.main run-digest

      # data/seen_postings.json is how the pipeline avoids re-sending the
      # same posting on the next run, and data/dashboard_history.json +
      # docs/index.html are the GitHub Pages dashboard (src/dashboard.py).
      # GitHub Actions runners are ephemeral (nothing persists between runs
      # on disk), so without this step every run would start from a blank
      # cache/history and you'd get duplicate postings and no dashboard
      # trend history. Committing them back to the repo is what makes both
      # actually work across runs.
      - name: Persist dedup cache and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_postings.json data/dashboard_history.json docs/index.html docs/.nojekyll
          git diff --staged --quiet || git commit -m "Update seen-postings cache and dashboard [skip ci]"
          git push
